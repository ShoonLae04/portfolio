<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Shoon Lae's Desk</title>
        <meta name="description" content="Shoon Lae Zayyar - Computer Engineering Student Portfolio.">
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=VT323&family=Lexend:wght@400;500;600;700;800&display=swap">

        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/taskbar.css">
        <link rel="stylesheet" href="css/desk.css">
        
        
        <script defer src="js/icons.js"></script>
        <script defer src="js/taskbar.js"></script>
        <script defer src="js/utils.js"></script>
        <script defer src="js/main.js"></script>

       
    </head>
    <body>
        <!-- Sky background  -->
        <div id="cloudbg" aria-hidden="true">
            <div class="glow"  style="left:-10%;top:-10%;width:50vw;height:40vh;background:#f2dcff "></div>
            <div class="glow"  style="right:-10%;bottom:10%;width:45vw;height:45vh;background:#d6f2ff "></div>
        </div>
        <main id="stage" aria-label="Shoon Lae Zayyar's Desk">
            <!-- name: the first thing visitors read -->
            <section class="hero">
            <h1 class="name">
                <!-- real text for screen readers; the letters below are decoration -->
                <span class="sr-only">Shoon Lae Zayyar</span>
                <span class="arc" aria-hidden="true" style="--n:16">
                <span style="--i:0">S</span><span style="--i:1">h</span>
                <span style="--i:2">o</span><span style="--i:3">o</span>
                <span style="--i:4">n</span><span style="--i:5">&nbsp;</span>
                <span style="--i:6">L</span><span style="--i:7">a</span><span style="--i:8">e</span>
                <span style="--i:9">&nbsp;</span>
                <span style="--i:10">Z</span><span style="--i:11">a</span>
                <span style="--i:12">y</span><span style="--i:13">y</span>
                <span style="--i:14">a</span><span style="--i:15">r</span>
                </span>
            </h1>
            <p class="tagline">Computer Engineering Student </p>
            
            </section>

        </main>
        <footer class="taskbar">
            <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false">
            <i data-icon="star" aria-hidden="true"></i>
                start
            </button>
            <div class="tasks" id="tasks" ></div>
            <div class="tray">
                <button class="music" id="musicBtn" aria-pressed="false">
                    <i data-icon="play" aria-hidden="true"></i>
                    play
                </button>
                <time class="clock" id="clock"></time>
            </div>
        </footer>

    </body>
</html>
