<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Shoon Lae's Desk</title>
        <meta name="description" content="Shoon Lae Zayyar - Computer Engineering Student Portfolio.">
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=VT323&family=Lexend:wght@400;500;600;700;800&display=swap">

        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/taskbar.css">
        <link rel="stylesheet" href="css/desk.css">
        <link rel="stylesheet" href="css/windows.css">
        
        
        <script defer src="js/icons.js"></script>
        <script defer src="js/utils.js"></script>
        <script defer src="js/content.js"></script>
        <script defer src="js/desk.js"></script>
        <script defer src="js/windows.js"></script>
        <script defer src="js/taskbar.js"></script>
        <script defer src="js/main.js"></script>
       
    </head>
    <body>
        <!-- Sky background  -->
        <div id="cloudbg" aria-hidden="true">
            <div class="glow"  style="left:-10%;top:-10%;width:50vw;height:40vh;background:#f2dcff "></div>
            <div class="glow"  style="right:-10%;bottom:10%;width:45vw;height:45vh;background:#d6f2ff "></div>
        </div>
        
        <main id="stage" aria-label="Shoon Lae Zayyar's Desk.">
            <!-- soft white glow behind the name -->
            <div class="blob" aria-hidden="true"></div>

            
            <!--  note in center -->
            
            <p class ="center-note">Welcome to my portfolio!</p>
            

            
            <!-- ===== stickers: each one opens a window ===== -->

            <!-- Projects: CD -->
            <button class="sticker sticker-projects" data-open="projects" aria-label="Projects">
                <span class="sticker-float">
                    <img class="sticker-art" src="assets/images/CDSticker.gif" alt="CD sticker">
                </span>
                <span class="tag">projects</span>
            </button>

            <!-- Contact: flip phone -->
            <button class="sticker sticker-contact" data-open="contact" aria-label="Contact">
                <span class="sticker-float">
                <img class="sticker-art" src="assets/images/PhoneSticker.gif" alt="flip phone with a heart on the screen">
                </span>
                <span class="tag">contact</span>
            </button>

            <!-- Experience: StackWindows-->
            <button class="sticker sticker-experience" data-open = "experience" aria-label = "Experience">
                <span class="sticker-float">
                    <img class="sticker-art" src="assets/images/StackWindowsStiker.gif" alt="StackWindows">
                </span>
                <span class="tag">experience</span>
            </button>

             <!-- Skills: MP3Player-->
            <button class="sticker sticker-skills" data-open = "skills" aria-label = "Skills">
                <span class="sticker-float">
                    <img class="sticker-art" src="assets/images/MP3PlayerSticker.gif" alt="MP3Player">
                </span>
                <span class="tag">skills</span>
            </button>

             <!-- Extra-curricular: Polaroid-->
            <button class="sticker sticker-activities" data-open = "activities" aria-label = "Activities">
                <span class="sticker-float">
                    <img class="sticker-art" src="assets/images/PolaroidSticker.gif" alt="Polaroid">
                </span>
                <span class="tag">Extra-curricular Activities</span>
            </button>

             <!-- Achievements : Trophy-->
            <button class="sticker sticker-achievements" data-open = "achievements" aria-label = "Achievements">
                <span class="sticker-float">
                    <img class="sticker-art" src="assets/images/TrophySticker.gif" alt="Trophy">
                </span>
                <span class="tag">Achievements and Certificates</span>
            </button>
            
            <!-- sky card: three clouds drift across a blue square -->
            <div class="sky-card" aria-hidden="true">
                <span class="cloud c1"></span>
                <span class="cloud c2"></span>
                <span class="cloud c3"></span>
                <p class="sky-text">Today's Weather <i data-icon = "cloud"></i></p>
            </div>

            <!-- About me: a big Notepad window in the middle  -->
            <section class="notepad" aria-hidden="true">
                <div class="win-bar">
                    Computer Engineering - Notepad
                    <span class="win-boxes"><b></b><b></b><b></b></span>
                </div>
                <div class="notepad-menu">
                    <span><u>F</u>ile</span><span><u>E</u>dit</span><span>F<u>o</u>rmat</span>
                    <span><u>V</u>iew</span><span><u>H</u>elp</span>
                </div>
                <!-- desk.js writes my About text, from ME in content.js-->
                <div class="notepad-text" id="about"></div>
            </section>

        </main>
        <!-- start menu: opens the windows -->
        <nav class="menu" id="menu" hidden aria-label="Start menu">
            <div class="menu-head">
                <b>Shoon Lae Zayyar</b>
                <small>computer engineering · temasek poly</small>
            </div>
            <button data-open="about"><i data-icon="pencil"></i>About me</button>
            <button data-open="projects"><i data-icon="album"></i>Projects</button>
        </nav>

        <!-- pop-up windows are added here by js/windows.js -->
        <div id="wins"></div>
        <footer class="taskbar">
            <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false">
            <i data-icon="star" aria-hidden="true"></i>
                start
            </button>
            <div class="tasks" id="tasks" ></div>
            <div class="tray">
                <button class="music" id="musicBtn" aria-pressed="false">
                    <i data-icon="play" aria-hidden="true"></i>
                    play
                </button>
                <time class="clock" id="clock"></time>
            </div>
        </footer>

    </body>
</html>
